name: CI

on: [push]

# deploy-pages exchanges an OIDC token, which needs id-token: write; pages:
# write authorizes the deployment itself. Without these the deploy job fails
# with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight Pages deployment; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  all:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run formatter
        run: npm run format:check
      - name: Run linter and formatter
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build bundle
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy on push to master branch
    if: github.ref == 'refs/heads/master'
    needs: all
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

